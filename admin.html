<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D3wa — لوحة الطلبات</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#141d33">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141d33'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23d98a53' stroke-width='2.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;600;800&family=Reem+Kufi:wght@600&display=swap">
<style>
:root{
  --bg:#141d33; --bg-2:#1b2542; --bg-3:#0e1628;
  --ink:#f0e9dc; --ink-2:#a2adc3; --accent:#d98a53;
  --ok:#5fd08a; --warn:#e3c05c; --err:#ea8b83;
  --line:rgba(240,233,220,.16); --line-soft:rgba(240,233,220,.08);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Alexandria",sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
.wrap{width:min(100%,1080px);margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line-soft);padding:16px 0;position:sticky;top:0;background:var(--bg-3);z-index:10}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:"Reem Kufi",sans-serif;font-weight:600;font-size:19px}
.brand i{width:28px;height:28px;border-radius:7px;border:1.5px solid var(--accent);display:grid;place-items:center;font-style:normal}
.brand i::after{content:"";width:13px;height:13px;border-radius:50%;border:2px solid var(--accent)}
.who{font-size:12px;color:var(--ink-2)}

h1{font-family:"Reem Kufi",sans-serif;font-weight:600;font-size:26px;margin:30px 0 6px}
.sub{color:var(--ink-2);font-size:13.5px;line-height:1.9;margin:0 0 24px}

.gate{max-width:420px;margin:60px auto;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);padding:28px}
.gate h2{font-family:"Reem Kufi",sans-serif;font-weight:600;font-size:20px;margin:0 0 8px}
label{display:block;font-size:12.5px;font-weight:600;margin:16px 0 6px}
input,select{width:100%;min-height:46px;padding:11px 13px;border:1px solid var(--line);border-radius:6px;background:var(--bg-3);color:var(--ink);font-family:inherit;font-size:14px}
input:focus,select:focus{outline:none;border-color:var(--accent)}
button{min-height:44px;padding:0 20px;border-radius:2px;border:1.5px solid var(--accent);background:var(--accent);color:#1a1204;font-family:inherit;font-weight:600;font-size:13.5px;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button.ghost:hover{background:rgba(217,138,83,.1)}
button:disabled{opacity:.5;cursor:default}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tabs button{min-height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-2);font-weight:400;font-size:12.5px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#1a1204;font-weight:600}

.order{border:1px solid var(--line);border-radius:10px;background:var(--bg-2);padding:18px;margin-bottom:14px}
.o-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.o-name{font-size:16px;font-weight:800}
.o-ref{font-size:11.5px;color:var(--ink-2);letter-spacing:.08em}
.pill{font-size:11px;font-weight:600;padding:4px 11px;border-radius:999px;border:1px solid currentColor}
.pill.pending{color:var(--warn)} .pill.paid{color:var(--accent)}
.pill.published{color:var(--ok)} .pill.cancelled{color:var(--err)}
.o-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px 18px;font-size:12.5px;color:var(--ink-2);margin-bottom:14px}
.o-meta b{color:var(--ink);font-weight:600}
.o-link{direction:ltr;text-align:left;font-size:12.5px;background:var(--bg-3);border-radius:6px;padding:9px 12px;word-break:break-all;margin-bottom:12px}
.o-link a{color:var(--accent);text-decoration:none}
.o-acts{display:flex;gap:8px;flex-wrap:wrap}
.o-acts button,.o-acts a{min-height:38px;padding:0 15px;font-size:12.5px;display:inline-flex;align-items:center;border-radius:2px;text-decoration:none}
.o-acts a{border:1.5px solid var(--line);color:var(--ink-2);background:transparent}
.o-acts a:hover{border-color:var(--accent);color:var(--accent)}
.empty{text-align:center;color:var(--ink-2);padding:50px 20px;font-size:14px}
.err{color:var(--err);font-size:13px;margin-top:12px}
.hide{display:none}
</style>
</head>
<body>

<header><div class="wrap">
  <div class="brand"><i></i>D3wa</div>
  <span class="who" id="who">لوحة الطلبات · Orders</span>
</div></header>

<!-- gate -->
<div class="wrap">
  <div class="gate" id="gate">
    <h2>الدخول</h2>
    <p class="sub" style="margin:6px 0 0">اكتب توكن الأدمن. بيتخزن في المتصفح ده بس.</p>
    <label for="tok">Admin token</label>
    <input type="password" id="tok" dir="ltr" autocomplete="current-password">
    <div style="margin-top:18px"><button id="enter">دخول</button></div>
    <div class="err hide" id="gateErr">التوكن غلط أو الـ API مش شغال.</div>
  </div>

  <main id="app" class="hide">
    <h1>الطلبات</h1>
    <p class="sub">اضغط «انشر» بعد ما تتأكد إن التحويل وصل — الدعوة بتتنشر على لينك العميل على طول والووترمارك بيختفي.</p>
    <div class="tabs" id="tabs">
      <button class="on" data-s="">الكل</button>
      <button data-s="pending">مستني الدفع</button>
      <button data-s="paid">مدفوع</button>
      <button data-s="published">منشور</button>
      <button data-s="cancelled">ملغي</button>
    </div>
    <div id="list"></div>
  </main>
</div>

<script>
(function () {
  "use strict";
  var API = location.origin;
  var token = "";
  var filter = "";
  var el = function (id) { return document.getElementById(id); };

  var LABEL = { pending:"مستني الدفع", paid:"مدفوع", published:"منشور", cancelled:"ملغي" };
  var TPL = { gold:"كلاسيك جولد", rose:"روز آند وايت", rustic:"رستيك", navy:"رويال نايفي",
    emerald:"إميرالد أندلسي", sahara:"صحارى بوهو", lotus:"سبوع اللوتس", henna:"ليلة حنة",
    deco:"جاتسبي", garden:"جاردن", modern:"مودرن", grad:"تخرج" };
  var PKG = { classic:"كلاسيك", signature:"سيجنتشر", royale:"رويال" };

  function api (path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ authorization: "Bearer " + token }, opts.headers || {});
    return fetch(API + path, opts).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function esc (s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function waLink (num, msg) {
    return "https://wa.me/" + String(num || "").replace(/\D/g, "") + "?text=" + encodeURIComponent(msg);
  }

  function card (o) {
    var live = API + "/" + o.slug;
    var published = o.status === "published";
    var notify = "دعوتكم اتنشرت 🤍\n" + live + "\nكل التفاصيل شغالة: العدّاد، الخريطة، وتأكيد الحضور بيوصلكم على واتساب مباشرة.";
    return '' +
      '<div class="order">' +
        '<div class="o-top">' +
          '<div><div class="o-name">' + esc(o.n_ar || o.n_en) + '</div>' +
          '<div class="o-ref">#' + esc(o.id) + ' · ' + esc(o.created_at || "").slice(0, 16).replace("T", " ") + '</div></div>' +
          '<span class="pill ' + esc(o.status) + '">' + (LABEL[o.status] || esc(o.status)) + '</span>' +
        '</div>' +
        '<div class="o-meta">' +
          '<span>التصميم <b>' + esc(TPL[o.template] || o.template) + '</b></span>' +
          '<span>الباقة <b>' + esc(PKG[o.package] || o.package) + '</b></span>' +
          '<span>المبلغ <b>' + esc(o.amount) + ' ج</b></span>' +
          '<span>التاريخ <b dir="ltr">' + esc(o.event_date || "—") + (o.event_time ? " " + esc(o.event_time) : "") + '</b></span>' +
          '<span>المكان <b>' + esc(o.v_ar || "—") + '</b></span>' +
          '<span>ردود الحضور <b dir="ltr">' + esc(o.rsvp_wa || "—") + '</b></span>' +
          (o.rush ? '<span>استعجال <b>٢٤ ساعة</b></span>' : "") +
        '</div>' +
        '<div class="o-link"><a href="' + esc(live) + '" target="_blank" rel="noopener">' + esc(live) + '</a></div>' +
        '<div class="o-acts">' +
          (published ? "" : '<button data-act="published" data-id="' + esc(o.id) + '">انشر الدعوة</button>') +
          (o.status === "pending" ? '<button class="ghost" data-act="paid" data-id="' + esc(o.id) + '">علّم مدفوع</button>' : "") +
          '<a href="' + esc(live) + '" target="_blank" rel="noopener">افتح</a>' +
          (o.contact_wa ? '<a href="' + esc(waLink(o.contact_wa, notify)) + '" target="_blank" rel="noopener">ابعتلهم اللينك</a>' : "") +
          (o.status === "cancelled" ? "" : '<button class="ghost" data-act="cancelled" data-id="' + esc(o.id) + '">إلغاء</button>') +
        '</div>' +
      '</div>';
  }

  function load () {
    return api("/api/admin/orders" + (filter ? "?status=" + filter : "")).then(function (d) {
      var list = d.orders || [];
      el("list").innerHTML = list.length
        ? list.map(card).join("")
        : '<div class="empty">مفيش طلبات هنا لسه.</div>';
    });
  }

  el("list").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]");
    if (!b) return;
    var act = b.getAttribute("data-act");
    if (act === "cancelled" && !confirm("تأكيد إلغاء الطلب؟")) return;
    b.disabled = true;
    api("/api/admin/orders/" + b.getAttribute("data-id") + "/mark", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ status: act })
    }).then(load).catch(function () { b.disabled = false; alert("مانفعش يتحدث. جرب تاني."); });
  });

  el("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-s]");
    if (!b) return;
    document.querySelectorAll("#tabs button").forEach(function (x) { x.classList.remove("on"); });
    b.classList.add("on");
    filter = b.getAttribute("data-s");
    load();
  });

  function unlock (t) {
    token = t;
    return load().then(function () {
      try { sessionStorage.setItem("d3wa-admin", token); } catch (e) {}
      el("gate").classList.add("hide");
      el("app").classList.remove("hide");
    });
  }

  el("enter").addEventListener("click", function () {
    el("gateErr").classList.add("hide");
    unlock(el("tok").value.trim()).catch(function () { el("gateErr").classList.remove("hide"); });
  });
  el("tok").addEventListener("keydown", function (e) { if (e.key === "Enter") el("enter").click(); });

  try {
    var saved = sessionStorage.getItem("d3wa-admin");
    if (saved) unlock(saved).catch(function () {});
  } catch (e) {}
})();
</script>

</body>
</html>
