name = "d3wa"
main = "src/index.js"
compatibility_date = "2026-06-01"

# The static site is served by the Worker, so a slug like /nada-ahmed-1ea0 can be
# rendered from D1 while everything else falls through to these files.
[assets]
directory = "../"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "d3wa"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

# Secrets are NOT set here. Use:
#   wrangler secret put ADMIN_TOKEN
#   wrangler secret put PAY_WEBHOOK_SECRET   # only once a card gateway exists
