<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصفحة مش موجودة — دعوة D3wa</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5efe3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f5efe3'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%239c4a1a' stroke-width='2.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;600&family=Reem+Kufi:wght@600&display=swap">
<style>
:root{--paper:#f5efe3;--ink:#231a10;--ink-2:#6d5f4b;--copper:#9c4a1a}
html[data-theme="dark"]{--paper:#141d33;--ink:#f0e9dc;--ink-2:#a2adc3;--copper:#d98a53}
html{color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;
  color:var(--ink);font-family:"Alexandria",sans-serif;font-weight:300;background:var(--paper)}
.ring{width:60px;height:60px;border-radius:50%;border:3px solid var(--copper);margin:0 auto 22px;opacity:.85}
h1{font-family:"Reem Kufi",sans-serif;font-weight:600;font-size:clamp(26px,6vw,40px);margin:0 0 10px;line-height:1.5}
p{color:var(--ink-2);line-height:2;margin:0 0 28px;font-size:15px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;
  border:1.5px solid var(--copper);border-radius:2px;color:var(--copper);text-decoration:none;font-weight:600;font-size:14.5px}
a:hover{background:rgba(156,74,26,.08)}
</style>
<script>
(function(){try{var t=localStorage.getItem("d3wa-theme");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
</head>
<body>
<div>
  <div class="ring"></div>
  <h1>اللينك ده مش موجود</h1>
  <p>يمكن الدعوة اتنقلت أو اللينك اتكتب غلط.<br>This page doesn't exist; the link may have moved or been mistyped.</p>
  <a href="/d3wa/">الرجوع لدعوة D3wa</a>
</div>
</body>
</html>
