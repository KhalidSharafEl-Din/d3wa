<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>D3wa share card</title>
<!-- Rendered at 1200x630 by `node scripts/shots.mjs --og` into assets/og/<slug>.png. ?t=<slug> for a design, nothing for the store. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=Readex+Pro:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/store.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--wine);color:var(--on-wine)}
.og{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:1fr 480px;align-items:center;padding:0 80px 0 40px}
.og::after{content:"";position:absolute;inset:22px;border:1px solid rgba(201,164,106,.45);pointer-events:none}
.txt{display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:12px}
.brand .seal{width:48px;height:48px}
.brand b{font:700 40px/1 var(--disp)}
.brand small{font:500 17px/1 var(--ui);color:var(--on-wine-2);padding-top:6px}
h1{font:600 92px/1.05 var(--disp);margin:18px 0 0;color:var(--on-wine)}
.en{font:500 34px/1.2 var(--disp);color:var(--on-wine-2);direction:ltr;text-align:right}
.meta{font:400 26px/1.5 var(--ui);color:var(--on-wine-2);margin-top:10px}
.meta b{color:var(--gold);font-weight:500}
.phones{position:relative;height:630px}
.phones .phone{position:absolute;width:250px;top:50%;translate:0 -50%}
.phones .phone:nth-child(1){left:120px;z-index:3}
.phones .phone:nth-child(2){left:-10px;rotate:-7deg;scale:.84;z-index:2}
.phones .phone:nth-child(3){left:250px;rotate:7deg;scale:.84;z-index:1}
.solo .phone{left:115px!important;width:270px!important;rotate:none!important;scale:1!important}
</style>
</head>
<body>
<div class="og">
  <div class="txt">
    <div class="brand"><svg class="seal" viewBox="0 0 40 40" aria-hidden="true"><path fill="var(--gold)" d="M20 1.8l3.1 2.4 3.9-.6 1.9 3.4 3.7 1.4.1 3.9 2.9 2.7-1.2 3.7 1.2 3.7-2.9 2.7-.1 3.9-3.7 1.4-1.9 3.4-3.9-.6L20 38.2l-3.1-2.4-3.9.6-1.9-3.4-3.7-1.4-.1-3.9-2.9-2.7 1.2-3.7-1.2-3.7 2.9-2.7.1-3.9 3.7-1.4 1.9-3.4 3.9.6z"/><text x="20" y="25.6" text-anchor="middle" font-family="Markazi Text,serif" font-weight="700" font-size="19" fill="var(--wine)">د</text></svg><b>دعوة</b><small>D3wa</small></div>
    <h1 id="h"></h1>
    <div class="en" id="e"></div>
    <div class="meta" id="m"></div>
  </div>
  <div class="phones" id="p"></div>
</div>
<script src="../assets/catalog.js"></script>
<script>
(function () {
  var C = window.D3WA, k = new URLSearchParams(location.search).get("t");
  var t = C.templates.filter(function (x) { return x.k === k; })[0];
  var from = function (p) { return C.packages.filter(function (x) { return x.k === p; })[0].price; };
  var phone = function (slug) { return '<span class="phone"><span class="scr"><img src="../assets/cards/' + slug + '.jpg" alt=""></span></span>'; };
  if (t) {
    document.getElementById("h").textContent = t.ar;
    document.getElementById("e").textContent = t.en;
    document.getElementById("m").innerHTML = t.mood.ar + "<br>دعوة رقمية بأساميكم، من <b>" + from(t.minPkg).toLocaleString("ar-EG") + " جنيه</b>";
    document.getElementById("p").innerHTML = phone(t.k);
    document.getElementById("p").classList.add("solo");
  } else {
    document.getElementById("h").textContent = "دعوة فرحكم، على لينك باسمكم";
    document.getElementById("e").textContent = "Digital invitations in Arabic and English";
    document.getElementById("m").innerHTML = "١٢ تصميم للفرح والخطوبة وكتب الكتاب والحنة والسبوع والتخرج، من <b>" + from("classic").toLocaleString("ar-EG") + " جنيه</b>";
    document.getElementById("p").innerHTML = phone("gold") + phone("emerald") + phone("henna");
  }
})();
</script>
</body>
</html>
